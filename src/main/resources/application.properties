# ========================
# MindTrack Backend Config
# ========================

# Server
server.port=8080

# ── MySQL Database ───────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/mindtrack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP Connection Pool ─────────────────────────────────
spring.datasource.hikari.pool-name=MindTrackHikariPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── Email Configuration ──────────────────────────────────────
# Using Gmail SMTP (you can use any SMTP provider)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mindtrack123.app@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Scheduler ────────────────────────────────────────────────
# Enable Spring scheduling
spring.task.scheduling.pool.size=5

# ── Logging ──────────────────────────────────────────────────
logging.level.com.M.mindtrack=DEBUG

# HikariCP logs — shows pool start/stop and connection events
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Hibernate SQL logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring datasource init logs
logging.level.org.springframework.jdbc=DEBUG
